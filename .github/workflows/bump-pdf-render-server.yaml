name: Bump pdf-render-server chart version

# Triggered by pdf-render-backend's "build our image" workflow via a
# repository_dispatch call whenever a stable (non-prerelease) release tag is
# published there. Payload: { "version": "0.0.3" }.
on:
  repository_dispatch:
    types: [pdf-render-server-released]

# contents: write - to commit and push the version bump directly to main.
# actions: write  - to explicitly dispatch release-charts.yaml afterwards
#   (a push made with this workflow's own GITHUB_TOKEN does NOT trigger
#   other workflows' `push` events, so we can't just rely on that).
permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Chart.yaml
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" ]]; then
            echo "::error::client_payload.version is empty" >&2
            exit 1
          fi
          sed -i "s/^version: .*/version: ${VERSION}/" charts/pdf-render-server/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/pdf-render-server/Chart.yaml

      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Chart.yaml already at ${VERSION}, nothing to do"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add charts/pdf-render-server/Chart.yaml
          git commit -m "chore(pdf-render-server): bump chart to ${VERSION}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger chart release
        # See the permissions comment above: our own push doesn't trigger
        # release-charts.yaml's `push` event, so dispatch it explicitly.
        if: success() && steps.commit.outputs.pushed == 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-charts.yaml/dispatches" \
            -d '{"ref":"main"}'

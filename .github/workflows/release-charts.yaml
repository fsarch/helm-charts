name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  # Also triggerable via the API (used by bump-chart.yaml): pushes made with
  # a workflow's own GITHUB_TOKEN don't fire other workflows' `push`
  # triggers, so that workflow explicitly dispatches this one instead of
  # relying on its own push to do so.
  workflow_dispatch: {}

# Allow the default GITHUB_TOKEN to push the gh-pages branch and create releases.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

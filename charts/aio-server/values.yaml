# -- Default values for the aio-server chart.
# Declare variables to be passed into your templates.

# -- Overrides the name used to build resource names (defaults to the chart name).
nameOverride: ""
# -- Overrides the full resource name (defaults to "<release name>-<chart name>").
fullnameOverride: ""

namespace:
  # -- Whether the chart should create the target Namespace itself.
  # Set to false if the namespace already exists / is managed elsewhere.
  create: false
  # -- Namespace to deploy the resources into. Defaults to the release namespace
  # (`.Release.Namespace`, i.e. whatever `--namespace` / `-n` was set to) when empty.
  name: ""

# -- Extra labels applied to every resource created by this chart.
commonLabels: {}

# -- Extra annotations applied to every resource created by this chart.
commonAnnotations: {}

replicaCount: 1

# -- Number of old ReplicaSets to retain for the Deployment.
revisionHistoryLimit: 3

# -- Optional HorizontalPodAutoscaler (autoscaling/v2). When enabled, the
# Deployment's `spec.replicas` is omitted (replicaCount is ignored) so the
# HPA is free to manage the replica count without fighting reconciliation.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # -- CPU utilization target (%) the HPA scales on. Set to "" to omit this metric.
  targetCPUUtilizationPercentage: 80
  # -- Memory utilization target (%) the HPA scales on. Set to "" to omit this metric (the default).
  targetMemoryUtilizationPercentage: ""
  # -- Additional raw `MetricSpec` entries (e.g. custom/external metrics), appended verbatim.
  metrics: []
  # -- Raw `HorizontalPodAutoscalerBehavior`, passed through verbatim when set.
  behavior: {}

image:
  repository: docker.io/fsarch/aio-server
  pullPolicy: Always
  # -- Overrides the image tag whose default is the chart appVersion.
  # Pinned to "latest" until aio-server's image.yml has pushed its first
  # versioned (v*) tag - after that, bump-chart.yaml rewrites this line to
  # the released version on every stable release.
  tag: "0.1.2"

# -- Secrets used to pull the image from a private registry.
imagePullSecrets: []

# -- Extra labels for the Pod template.
podLabels: {}

# -- Extra annotations for the Pod template.
podAnnotations: {}

podSecurityContext: {}
# runAsNonRoot: true
# runAsUser: 1000

securityContext: {}
# readOnlyRootFilesystem: true
# allowPrivilegeEscalation: false

serviceAccount:
  # -- Whether a ServiceAccount should be created.
  create: false
  # -- Name of the ServiceAccount to use. If not set and `create` is true, a name is generated.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  # -- Additional annotations for the Service.
  annotations: {}

containerPort: 8080

# -- One extra Service per `config.services[]` entry with its own `port`
# (named `<fullname>-<id>`), so that mount is reachable in-cluster without
# its `/<id>` prefix, like a standalone service: it listens on `port` and
# forwards to the mount's port in the pod. The main `service` above keeps
# serving every mount under its prefix.
servicePorts:
  enabled: true
  type: ClusterIP
  port: 80
  # -- Annotations added to each of these Services.
  annotations: {}
  # -- Per-mount overrides, keyed by `config.services[].id`: `name` replaces
  # the generated `<fullname>-<id>` Service name, `annotations` are merged
  # over the shared ones above.
  overrides: {}
  # overrides:
  #   material-tracing:
  #     name: material-tracing-server
  #     annotations:
  #       example.com/team: tracing

# -- application env vars managed via well-known values below.
# Set to "" to omit an env var entirely.
env:
  # -- Port the application listens on (PORT env var). Should usually match `containerPort`.
  port: "8080"
  # -- Path inside the container the rendered config.yml is mounted at.
  configFilePath: /etc/aio-server/config.yml

# -- Additional freeform environment variables (list of standard Kubernetes EnvVar objects).
extraEnv: []
# - name: LOG_LEVEL
#   value: debug

configMap:
  # -- Whether to create the ConfigMap holding config.yml. Disable to bring your own.
  create: true
  # -- Overrides the ConfigMap name (defaults to "<fullname>-config").
  nameOverride: ""

# -- config.yml contents, rendered from structured values below.
# Set `config.raw` to a literal YAML/string block to bypass the structured
# values entirely and use it verbatim as config.yml.
#
# Unlike the single-service charts, aio-server's config.yml has no
# top-level auth/database/uac sections of its own: every mounted service
# carries those inside its own `services[].config` entry, in exactly the
# shape that service's standalone config.yml would have (see the
# corresponding single-service chart / app repo for the options per
# section). Since that's a heterogeneous list of per-service schemas,
# `config.services` is a freeform passthrough rendered verbatim via
# `toYaml` - see this chart's README for a multi-service example.
config:
  raw: ""

  # -- Services to mount, one entry per mount: `id` (route prefix and
  # TypeORM connection name - must be unique), `type` (which service
  # package: calendar-server, metric-server, function-gateway,
  # function-server, function-node-worker, image-editor-server,
  # image-server, frontier-api, material-tracing-server), optionally its own
  # `port` (see `servicePorts`) and that service's own `config`. The same
  # `type` may be mounted several times under different `id`s.
  # Must not be empty (the chart fails to render otherwise) - the default
  # below is a single placeholder mount to show the shape, not a real
  # deployment's values.
  services:
    - id: calendar
      type: calendar-server
      config:
        auth:
          type: oidc
          discovery_url: "https://login.example.com/.well-known/openid-configuration"
        database:
          type: postgres
          host: ""
          port: 5432
          database: calendar-server
          username: ""
          # Sensitive - prefer setting via a non-committed values file.
          password: ""
          ssl:
            rejectUnauthorized: true
        deletion:
          hard_delete_after_days: 30
          purge_schedule:
            cron: "0 0 * * *"
            timezone: "Europe/Berlin"

  # -- OpenTelemetry tracing (@fsarch/server built-in). Read from the
  # root of config.yml (not per service) - one tracer for the whole
  # process. `null` (the default) omits the `tracing:` section entirely.
  # `exporter.type` is mutually exclusive: `console` needs no extra
  # fields, `otlp-http`/`otlp-grpc` need `url` (+ optional `headers`).
  tracing: null
  # tracing:
  #   enabled: true
  #   serviceName: aio-server
  #   sampler: parentbased_traceidratio
  #   sampleRatio: 1.0
  #   exporter:
  #     type: otlp-http
  #     url: http://otel-collector.fsarch.svc.cluster.local:4318/v1/traces

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  # Higher than the single-service charts - every mounted service runs its
  # own migrations/initialisation before the HTTP server starts listening.
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  # Sized for several services in one process plus Chromium
  # (image-editor-server's html-layer rendering) - adjust to what you mount.
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# -- Extra volumes appended to the Deployment's pod spec.
extraVolumes: []

# -- Extra volume mounts appended to the aio-server container.
extraVolumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aio-server.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Default values for the frontier-worker chart.
# Declare variables to be passed into your templates.

# -- Overrides the name used to build resource names (defaults to the chart name).
nameOverride: ""
# -- Overrides the full resource name (defaults to "<release name>-<chart name>").
fullnameOverride: ""

namespace:
  # -- Whether the chart should create the target Namespace itself.
  # Set to false if the namespace already exists / is managed elsewhere.
  create: false
  # -- Namespace to deploy the resources into. Defaults to the release namespace
  # (`.Release.Namespace`, i.e. whatever `--namespace` / `-n` was set to) when empty.
  name: ""

# -- Extra labels applied to every resource created by this chart.
commonLabels: {}

# -- Extra annotations applied to every resource created by this chart.
commonAnnotations: {}

replicaCount: 1

# -- Number of old ReplicaSets to retain for the Deployment.
revisionHistoryLimit: 3

image:
  # -- frontier-worker is one of two deployables built out of the
  # fsarch/frontier-server monorepo (apps/frontier-worker, apps/frontier-api
  # - see the sibling frontier-server chart, which despite the app repo
  # directory being named apps/frontier-api publishes as
  # fsarch/frontier-server to match the monorepo's own name) - each
  # publishes to its own image repository (fsarch/frontier-worker /
  # fsarch/frontier-server), same one-image-per-chart convention as
  # everywhere else in this repo.
  repository: docker.io/fsarch/frontier-worker
  pullPolicy: Always
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.3"

# -- Secrets used to pull the image from a private registry.
imagePullSecrets: []

# -- Extra labels for the Pod template.
podLabels: {}

# -- Extra annotations for the Pod template.
podAnnotations: {}

podSecurityContext: {}
# runAsNonRoot: true
# runAsUser: 1000

securityContext: {}
# readOnlyRootFilesystem: true
# allowPrivilegeEscalation: false

serviceAccount:
  # -- Whether a ServiceAccount should be created.
  create: false
  # -- Name of the ServiceAccount to use. If not set and `create` is true, a name is generated.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  # -- Additional annotations for the Service.
  annotations: {}

# -- Container port the application listens on.
containerPort: 8080

# -- application env vars managed via well-known values below.
# Set to "" to omit an env var entirely.
env:
  # -- frontier-worker reads `FRONTIER_WORKER_PORT`, not `PORT` - left empty
  # to skip the (useless) `PORT` var fsarch-common would otherwise set; see
  # `extraEnv` below for the real one.
  port: ""
  # -- Path inside the container the rendered config.yml is mounted at, IF
  # `configMap.create` is enabled (it's off by default - see config.raw's
  # comment below for why).
  configFilePath: /etc/frontier-worker/config.yml

# -- Additional freeform environment variables (list of standard Kubernetes
# EnvVar objects). Unlike every @fsarch/server-based chart here,
# frontier-worker isn't config.yml-driven at all - almost everything is env
# vars (src/main.ts), so the required ones are pre-populated below rather
# than left as an empty example.
extraEnv:
  # -- Port the HTTP proxy server listens on. Should usually match
  # `containerPort`.
  - name: FRONTIER_WORKER_PORT
    value: "8080"
  # -- Websocket URL of the frontier-server control plane to connect to
  # (its `/api/workers/websocket` endpoint).
  - name: FRONTIER_CONTROL_PLANE_URL
    value: "ws://frontier-server.example.com/api/workers/websocket"
  # -- Shared secret presented to frontier-server - must match the sibling
  # frontier-server chart's `config.workers.websocket.authToken`. Sensitive -
  # prefer setting via --set or a non-committed values file.
  - name: FRONTIER_WORKER_AUTH_TOKEN
    value: ""
  # -- Uncomment to override defaults:
  # - name: FRONTIER_WORKER_HEARTBEAT_MS
  #   value: "10000"
  # - name: FRONTIER_WORKER_LOG_INGEST_URL
  #   value: "http://frontier-server.example.com/api/workers/logs"
  # - name: FRONTIER_WORKER_CONFIG_PATH
  #   value: /etc/frontier-worker/config.yml   # set this when configMap.create: true
  # - name: FRONTIER_WORKER_DEBUG
  #   value: "true"

configMap:
  # -- Whether to create the ConfigMap holding config.yml. Off by default -
  # unlike every other chart here, frontier-worker's config.yml is entirely
  # optional (a single `function_worker:` integration, gracefully skipped
  # if missing/unreadable - see config.raw's comment below). Enable this
  # AND add `FRONTIER_WORKER_CONFIG_PATH` to extraEnv (see above) to wire
  # it up.
  create: false
  # -- Overrides the ConfigMap name (defaults to "<fullname>-config").
  nameOverride: ""

# -- config.yml contents, rendered from structured values below (only takes
# effect when `configMap.create: true`). Set `config.raw` to a literal
# YAML/string block to bypass `config.functionWorker` entirely.
#
# frontier-worker's config.yml is NOT a full app config like the other
# charts here - it's a single optional `function_worker:` block
# (src/runtime/config-loader.ts loads it best-effort and silently falls
# back to `{}` if the file is missing, so this integration can be skipped
# entirely by leaving `configMap.create: false`).
config:
  raw: ""

  # -- The function-node-worker instance frontier-worker can additionally
  # dispatch to. All fields required if set at all; `clientSecret` is
  # sensitive - prefer setting via --set or a non-committed values file.
  functionWorker:
    type: remote
    url: "http://function-node-worker.example.com"
    auth:
      type: openid-client-credentials
      tokenEndpoint: "https://login.example.com/realms/example/protocol/openid-connect/token"
      clientId: frontier-worker
      clientSecret: ""

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Extra volumes appended to the Deployment's pod spec.
extraVolumes: []

# -- Extra volume mounts appended to the frontier-worker container.
extraVolumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: frontier-worker.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

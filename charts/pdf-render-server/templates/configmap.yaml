{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pdf-render-server.configMapName" . }}
  namespace: {{ include "pdf-render-server.namespace" . }}
  labels:
    {{- include "pdf-render-server.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yml: |
    {{- if .Values.config.raw }}
    {{- .Values.config.raw | nindent 4 }}
    {{- else }}
    auth:
      {{- toYaml .Values.config.auth | nindent 6 }}

    uac:
      {{- toYaml .Values.config.uac | nindent 6 }}
    {{- end }}
{{- end }}
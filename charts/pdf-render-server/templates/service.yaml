apiVersion: v1
kind: Service
metadata:
  name: {{ include "pdf-render-server.fullname" . }}
  namespace: {{ include "pdf-render-server.namespace" . }}
  labels:
    {{- include "pdf-render-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pdf-render-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
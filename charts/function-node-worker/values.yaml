# -- Default values for the function-node-worker chart.
# Declare variables to be passed into your templates.

# -- Overrides the name used to build resource names (defaults to the chart name).
nameOverride: ""
# -- Overrides the full resource name (defaults to "<release name>-<chart name>").
fullnameOverride: ""

namespace:
  # -- Whether the chart should create the target Namespace itself.
  # Set to false if the namespace already exists / is managed elsewhere.
  create: false
  # -- Namespace to deploy the resources into. Defaults to the release namespace
  # (`.Release.Namespace`, i.e. whatever `--namespace` / `-n` was set to) when empty.
  name: ""

# -- Extra labels applied to every resource created by this chart.
commonLabels: {}

# -- Extra annotations applied to every resource created by this chart.
commonAnnotations: {}

replicaCount: 1

# -- Number of old ReplicaSets to retain for the Deployment.
revisionHistoryLimit: 3

image:
  repository: docker.io/fsarch/function-node-worker
  pullPolicy: Always
  # -- Defaults to "latest" rather than the chart appVersion (same caveat as
  # function-server) - function-node-worker's own image-build workflow
  # doesn't push versioned tags yet, only :latest, so falling back to
  # appVersion would point at a tag that doesn't exist. Override once that
  # changes.
  tag: "latest"

# -- Secrets used to pull the image from a private registry.
imagePullSecrets: []

# -- Extra labels for the Pod template.
podLabels: {}

# -- Extra annotations for the Pod template.
podAnnotations: {}

podSecurityContext: {}
# runAsNonRoot: true
# runAsUser: 1000

securityContext: {}
# readOnlyRootFilesystem: true
# allowPrivilegeEscalation: false

serviceAccount:
  # -- Whether a ServiceAccount should be created.
  create: false
  # -- Name of the ServiceAccount to use. If not set and `create` is true, a name is generated.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  # -- Additional annotations for the Service.
  annotations: {}

# -- Container port the application listens on.
containerPort: 8080

# -- application env vars managed via well-known values below.
# Set to "" to omit an env var entirely.
env:
  # -- Port the application listens on (PORT env var). Should usually match `containerPort`.
  port: "8080"
  # -- Path inside the container the rendered config.yml is mounted at.
  configFilePath: /etc/function-node-worker/config.yml

# -- Additional freeform environment variables (list of standard Kubernetes EnvVar objects).
extraEnv: []
# - name: LOG_LEVEL
#   value: debug

configMap:
  # -- Whether to create the ConfigMap holding config.yml. Disable to bring your own.
  create: true
  # -- Overrides the ConfigMap name (defaults to "<fullname>-config").
  nameOverride: ""

# -- config.yml contents, rendered from structured values below.
# Set `config.raw` to a literal YAML/string block to bypass the structured
# values entirely and use it verbatim as config.yml.
#
# Note: unlike pdf-render-server/metric-server/function-server,
# function-node-worker doesn't wire up `uac`/`database` at all
# (`FsarchModule.register({ auth: {} })` in its app.module.ts only enables
# the auth module) even though its example config.yml/vendored types still
# mention them - dead config, intentionally omitted here. `config.auth`
# also only supports `jwt-jwk`/`static` (no `oidc` module is registered).
config:
  raw: ""

  # auth.type selects which auth scheme is rendered into config.yml's
  # `auth:` section - mutually exclusive, only the field(s) for the active
  # type are rendered:
  #   - type: jwt-jwk -> renders auth.jwkUrl
  #   - type: static  -> renders auth.secret and auth.users (id/username/password)
  auth:
    type: jwt-jwk
    # -- JWK endpoint used to validate tokens when type is "jwt-jwk".
    jwkUrl: "https://login.example.com/protocol/openid-connect/certs"
    # -- Shared secret used to sign/verify tokens when type is "static".
    # Sensitive - prefer setting via --set or a non-committed values file.
    secret: ""
    # -- Local user list used when type is "static".
    users: []
    # - id: "11111111-1111-1111-1111-111111111111"
    #   username: admin
    #   password: "<set via --set or a secret values file>"

  # -- `worker_auth:` - how this worker authenticates itself (OAuth2 client
  # credentials) when calling back into function-server. All fields
  # required by the app; `clientSecret` is sensitive - prefer setting via
  # --set or a non-committed values file.
  workerAuth:
    type: openid-client-credentials
    tokenEndpoint: "https://login.example.com/realms/example/protocol/openid-connect/token"
    clientId: function-node-worker
    clientSecret: ""

  # -- `function_server:` - the function-server instance this worker polls
  # for work and reports results back to. `type` is always "remote" (the
  # only value the app accepts). Reuses the same client-credentials shape
  # as `workerAuth` (usually the same client, but modeled separately since
  # the app itself keeps them as two independent config blocks).
  functionServer:
    type: remote
    url: "http://function-server.example.com"
    auth:
      type: openid-client-credentials
      tokenEndpoint: "https://login.example.com/realms/example/protocol/openid-connect/token"
      clientId: function-node-worker
      # -- Sensitive - prefer setting via --set or a non-committed values file.
      clientSecret: ""

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Extra volumes appended to the Deployment's pod spec.
extraVolumes: []

# -- Extra volume mounts appended to the function-node-worker container.
extraVolumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: function-node-worker.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
